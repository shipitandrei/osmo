<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>Robo Eyes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .preview-section {
      position: fixed;
      inset: 0;

      width: 100vw;
      width: 100dvw;

      height: 100vh;
      height: 100dvh;

      margin: 0;
      padding: 0;

      background: #000;
      overflow: hidden;
    }

    .oled-display {
      position: fixed;
      inset: 0;

      width: 100vw;
      width: 100dvw;

      height: 100vh;
      height: 100dvh;

      margin: 0;
      padding: 0;

      background: #000;

      border: none;
      border-radius: 0;
      box-shadow: none;

      overflow: hidden;
    }

    #eye-canvas {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;
    }

    /* Hide the desktop UI while keeping the elements
       that main.js expects in the DOM. */
    .preview-section h1,
    .preview-section .subtitle,
    .status,
    .settings-section {
      display: none;
    }
  </style>
</head>

<body>

  <div class="preview-section">

    <div class="oled-display">
      <canvas id="eye-canvas" width="320" height="180"></canvas>
    </div>

    <!-- Kept because main.js may reference it -->
    <div class="status" id="fps"></div>

  </div>

  <script type="module" src="/src/main.js"></script>

</body>
</html>

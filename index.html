<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Osmo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #eye-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #setup-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0a0a0a;
    }

    #setup-box {
      width: min(420px, 100%);
      padding: 28px;
      border-radius: 20px;
      background: #151515;
      color: white;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    #setup-box h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    #setup-box p {
      margin-bottom: 20px;
      color: #aaa;
      line-height: 1.45;
    }

    #api-key {
      width: 100%;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 10px;
      outline: none;
      background: #0d0d0d;
      color: white;
      font-size: 16px;
    }

    #save-key {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #setup-error {
      margin-top: 12px;
      color: #ff7777;
      font-size: 14px;
    }

    #controls {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 20;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    #listen-button {
      width: 72px;
      height: 72px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: black;
      font-size: 30px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
    }

    #listen-button.listening {
      background: #ff4444;
      color: white;
    }

    #status {
      min-height: 20px;
      max-width: 85vw;
      padding: 5px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }

    #settings-button {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 30;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <canvas id="eye-canvas"></canvas>

  <div id="setup-screen">
    <div id="setup-box">
      <h1>🤖 Osmo</h1>
      <p>
        Enter your Gemini API key to give Osmo a brain.
        The key is saved locally on this device.
      </p>

      <input
        id="api-key"
        type="password"
        autocomplete="off"
        placeholder="Gemini API key"
        spellcheck="false"
      >

      <button id="save-key">Start Osmo</button>

      <div id="setup-error"></div>
    </div>
  </div>

  <button id="settings-button" class="hidden" title="Settings">⚙️</button>

  <div id="controls" class="hidden">
    <button id="listen-button" title="Talk to Osmo">🎤</button>
    <div id="status">Tap the microphone to talk</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
